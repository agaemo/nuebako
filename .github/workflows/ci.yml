name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手動実行では、macOS と Windows のインストーラをビルドして、成果物として取得できる(Windows 実機での確認用)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm の版は .mise.toml と同じ版に固定する(package.json の packageManager は、ロックファイルの更新が要るため未使用)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: "1.99"
          components: rustfmt,clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # tauri の generate_context! は ../dist の存在を前提にするため、先にフロントエンドをビルドする
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec oxlint src/
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: pnpm exec vitest run

  # 手動実行専用。成果物は workflow artifact として取得するだけで、リリースには添付しない
  bundle:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
            targets: aarch64-apple-darwin
          - os: windows-latest
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm の版は .mise.toml と同じ版に固定する(package.json の packageManager は、ロックファイルの更新が要るため未使用)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: "1.99"
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      # 依存のインストールスクリプトは実行しない(ビルドに不要なことを確認済み)
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # tagName を指定しないので、リリースは作らず、ビルドだけ行う
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true

name: Release

# v* タグの push で、macOS(Apple Silicon)のインストーラをビルドし、GitHub Releases に公開する。
# 構成の方針: 依存のビルド(サードパーティのコードが走る)は、書き込み権限のない build ジョブだけで行う。
# リリースへの添付は、ビルドを含まない publish ジョブだけが行う。失敗した場合は、リリースを作らない。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # タグ(先頭の v を除く)と、3つの version が一致することを確認する
      - name: タグと version の一致確認
        shell: bash
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(grep -m1 '"version"' package.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          tauri_version=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          cargo_version=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          echo "tag=$tag_version package.json=$pkg_version tauri.conf.json=$tauri_version Cargo.toml=$cargo_version"
          for v in "$pkg_version" "$tauri_version" "$cargo_version"; do
            if [ "$v" != "$tag_version" ]; then
              echo "::error::タグ($tag_version)と version が一致しません"
              exit 1
            fi
          done
      # タグのコミットが main に含まれ、そのコミットの CI(push)が成功していることを確認する
      - name: main 上のコミットと CI の成功の確認
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          # compare の status が behind/identical なら、SHA は main の祖先(= main 上のコミット)
          status=$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)
          if [ "$status" != "behind" ] && [ "$status" != "identical" ]; then
            echo "::error::タグのコミットが main に含まれていません(status=$status)"
            exit 1
          fi
          ok=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success" --jq '.total_count')
          if [ "$ok" -lt 1 ]; then
            echo "::error::このコミットの CI(push)が成功していません"
            exit 1
          fi

  # 書き込み権限なし。成果物は workflow artifact に出すだけ
  build:
    needs: check
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
            targets: aarch64-apple-darwin
            name: macos-arm64
          # Windows のインストーラは、実機での確認ができるまで、配布しない(CI のビルドとテストは ci.yml で行う)。
          # 追加するときは、ここに windows-latest を足し、provenance の SHA256SUMS の対象(*.exe)も確認する。
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm の版は .mise.toml と同じ版に固定する(package.json の packageManager は、ロックファイルの更新が要るため未使用)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: "1.99"
          targets: ${{ matrix.targets }}
      # リリース用のビルドでは、キャッシュを保存しない(キャッシュの汚染を避ける)
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: "false"
      # 依存のインストールスクリプトは実行しない(ビルドに不要なことを確認済み)
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # 署名・公証は行わない(署名用の secrets は使わない)。tagName を指定しないので、ビルドだけ行う
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.name }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # SHA256SUMS を作り、ビルドの証明書(provenance)を付ける。ビルドは含まない
  provenance:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installer-*
          path: release
          merge-multiple: true
      # upload-artifact は、共通の親フォルダからの相対パスを保つため、成果物が深い階層に入る。1つのフォルダにまとめる
      - name: 成果物をまとめて、SHA256SUMS を作成
        shell: bash
        run: |
          set -eu
          mkdir -p dist-files
          find release -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp -t dist-files {} +
          cd dist-files
          if [ -z "$(ls -A)" ]; then
            echo "::error::インストーラが見つかりません"
            exit 1
          fi
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-files/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist-files/*
          if-no-files-found: error

  # build と provenance の全てが成功したときだけ実行される。ビルドは含まない
  publish:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release
      - name: リリースを作成して公開
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # フォルダが混ざっていると、添付に失敗する(成果物は、平らなファイルだけ)
          if [ -n "$(find release -mindepth 1 -type d)" ]; then
            echo "::error::成果物にフォルダが含まれています"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "nuebako $GITHUB_REF_NAME" \
            --generate-notes
